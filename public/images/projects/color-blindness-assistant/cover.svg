<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="cbaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#082f49" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#cbaBg)" />

  <!-- Data Grid & Neural Wave Lines -->
  <g stroke="rgba(6,182,212,0.15)" stroke-width="1.5">
    <path d="M 50 380 Q 200 200, 400 320 T 750 180" fill="none" />
    <path d="M 50 420 Q 250 250, 450 390 T 750 220" fill="none" />
  </g>

  <!-- Central Analysis Card -->
  <rect x="120" y="80" width="560" height="340" rx="16" fill="#0f172a" stroke="rgba(6,182,212,0.4)" stroke-width="2" />

  <!-- Card Top Banner -->
  <rect x="120" y="80" width="560" height="55" rx="16" fill="#1e293b" />
  <circle cx="150" cy="107" r="8" fill="#06b6d4" />
  <text x="175" y="112" font-family="system-ui, sans-serif" font-weight="700" font-size="16" fill="#f8fafc">
    Color Blindness Assistant · AI Guidance System
  </text>
  <rect x="540" y="95" width="120" height="24" rx="12" fill="#082f49" stroke="#0ea5e9" />
  <text x="600" y="111" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#38bdf8">
    Scientific Research
  </text>

  <!-- Color Vision Spectrum Simulation Rings -->
  <g transform="translate(200, 240)">
    <circle cx="0" cy="0" r="60" fill="none" stroke="#ef4444" stroke-width="8" stroke-dasharray="80 20" opacity="0.8" />
    <circle cx="0" cy="0" r="45" fill="none" stroke="#10b981" stroke-width="8" stroke-dasharray="60 15" opacity="0.8" />
    <circle cx="0" cy="0" r="30" fill="none" stroke="#3b82f6" stroke-width="8" stroke-dasharray="40 10" opacity="0.8" />
    <circle cx="0" cy="0" r="12" fill="#38bdf8" />
  </g>

  <!-- Analysis Information Columns -->
  <rect x="300" y="160" width="350" height="70" rx="8" fill="#182234" stroke="#334155" />
  <text x="320" y="188" font-family="system-ui, sans-serif" font-weight="600" font-size="14" fill="#e2e8f0">
    Problem Analysis & Data Scoping
  </text>
  <text x="320" y="212" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">
    Analyzing color-dependent career pathways with structured data.
  </text>

  <rect x="300" y="245" width="350" height="70" rx="8" fill="#182234" stroke="#334155" />
  <text x="320" y="273" font-family="system-ui, sans-serif" font-weight="600" font-size="14" fill="#e2e8f0">
    Data Collection & Modeling Support
  </text>
  <text x="320" y="297" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">
    Preprocessed domain datasets for assistive AI advisory workflow.
  </text>

  <!-- Bottom Technology Chips -->
  <rect x="300" y="330" width="80" height="26" rx="13" fill="#082f49" stroke="#0ea5e9" />
  <text x="340" y="347" text-anchor="middle" font-family="monospace" font-size="11" fill="#7dd3fc">Python</text>

  <rect x="390" y="330" width="110" height="26" rx="13" fill="#082f49" stroke="#0ea5e9" />
  <text x="445" y="347" text-anchor="middle" font-family="monospace" font-size="11" fill="#7dd3fc">Data Analysis</text>

  <rect x="510" y="330" width="125" height="26" rx="13" fill="#082f49" stroke="#0ea5e9" />
  <text x="572" y="347" text-anchor="middle" font-family="monospace" font-size="11" fill="#7dd3fc">Machine Learning</text>
</svg>
