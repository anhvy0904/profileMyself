<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="aiAgingBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#aiAgingBg)" />

  <!-- Background Glowing Circles -->
  <circle cx="650" cy="120" r="180" fill="url(#emeraldGrad)" opacity="0.1" filter="blur(40px)" />
  <circle cx="150" cy="380" r="150" fill="#06b6d4" opacity="0.1" filter="blur(40px)" />

  <!-- Mobile Device Mockup -->
  <g transform="translate(140, 40)">
    <!-- Phone Body -->
    <rect x="0" y="0" width="220" height="420" rx="36" fill="#020617" stroke="#10b981" stroke-width="3" />
    <!-- Dynamic Island / Speaker Notch -->
    <rect x="75" y="12" width="70" height="18" rx="9" fill="#0f172a" />
    
    <!-- Screen Content -->
    <rect x="12" y="42" width="196" height="364" rx="26" fill="#09131d" />
    
    <!-- Elderly Care Header -->
    <text x="30" y="75" font-family="system-ui, sans-serif" font-weight="700" font-size="14" fill="#f8fafc">
      AI Aging Care
    </text>
    <circle cx="185" cy="70" r="12" fill="#064e3b" />
    <text x="185" y="74" text-anchor="middle" font-size="10" fill="#34d399">❤</text>

    <!-- Real-time Emotion Detection Widget -->
    <rect x="24" y="95" width="172" height="110" rx="14" fill="#132337" stroke="rgba(16,185,129,0.4)" stroke-width="1.5" />
    <text x="36" y="120" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#34d399">
      Emotion Analysis
    </text>
    
    <!-- Emotion Radar / Face Silhouette -->
    <circle cx="110" cy="155" r="28" fill="#064e3b" stroke="#10b981" stroke-width="2" />
    <circle cx="102" cy="150" r="3" fill="#34d399" />
    <circle cx="118" cy="150" r="3" fill="#34d399" />
    <path d="M 103 162 Q 110 170 117 162" stroke="#34d399" stroke-width="2" fill="none" />
    <text x="110" y="195" text-anchor="middle" font-family="monospace" font-size="9" fill="#94a3b8">
      STATUS: CALM & POSITIVE
    </text>

    <!-- Personalized Routine Recommendation -->
    <rect x="24" y="220" width="172" height="60" rx="12" fill="#132337" />
    <text x="36" y="242" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#f8fafc">
      Daily Activity Proposal
    </text>
    <text x="36" y="262" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">
      Light afternoon walk & breathing
    </text>

    <!-- Bottom Navigation Bar -->
    <rect x="24" y="295" width="172" height="40" rx="10" fill="#0b1726" />
    <circle cx="55" cy="315" r="6" fill="#10b981" />
    <circle cx="110" cy="315" r="6" fill="#334155" />
    <circle cx="165" cy="315" r="6" fill="#334155" />
  </g>

  <!-- Right Side Feature Callouts -->
  <g transform="translate(410, 80)">
    <!-- Competition Ribbon -->
    <rect x="0" y="0" width="280" height="34" rx="17" fill="#064e3b" stroke="#10b981" stroke-width="1.5" />
    <text x="140" y="22" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="700" font-size="13" fill="#34d399">
      AI FOR LIFE · Top 20 / 256 Teams
    </text>

    <!-- Description Block -->
    <text x="0" y="75" font-family="system-ui, sans-serif" font-weight="800" font-size="28" fill="#f8fafc">
      AI Aging Care
    </text>
    <text x="0" y="105" font-family="system-ui, sans-serif" font-size="14" fill="#94a3b8">
      Elderly Healthcare & Emotional Wellbeing Mobile App
    </text>

    <!-- Feature 1 -->
    <rect x="0" y="130" width="350" height="60" rx="10" fill="#0f172a" stroke="#1e293b" />
    <text x="20" y="155" font-family="system-ui, sans-serif" font-weight="600" font-size="13" fill="#f8fafc">
      UI/UX Design in Figma
    </text>
    <text x="20" y="175" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">
      Senior-friendly visual hierarchy and intuitive ergonomics.
    </text>

    <!-- Feature 2 -->
    <rect x="0" y="205" width="350" height="60" rx="10" fill="#0f172a" stroke="#1e293b" />
    <text x="20" y="230" font-family="system-ui, sans-serif" font-weight="600" font-size="13" fill="#f8fafc">
      Real-Time Emotion Recognition
    </text>
    <text x="20" y="250" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">
      Vision AI model to detect user emotions in real-time.
    </text>

    <!-- Feature 3 -->
    <rect x="0" y="280" width="350" height="60" rx="10" fill="#0f172a" stroke="#1e293b" />
    <text x="20" y="305" font-family="system-ui, sans-serif" font-weight="600" font-size="13" fill="#f8fafc">
      Personalized Activity Proposals
    </text>
    <text x="20" y="325" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">
      Custom recommendations tailored to daily behavior.
    </text>
  </g>
</svg>
